id = "andpeicunha.output-comment-composer"
name = "output-comment-composer"
version = "0.4.1"
min_herdr_version = "0.9.5"
platforms = ["macos", "linux"]
description = "Review Claude Code and Codex output block by block, comment on any line (even inside tables and code), and send the feedback back to the agent."

[[panes]]
id = "pane"
title = "output comments"
placement = "zoomed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/output-comment-composer\""]

[[actions]]
id = "toggle"
title = "output comments: toggle composer"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "toggle"]

[[actions]]
id = "open"
title = "output comments: open composer"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "open"]

[[actions]]
id = "close"
title = "output comments: close composer"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "close"]
